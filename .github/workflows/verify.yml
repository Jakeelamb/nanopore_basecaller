name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cpu-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "0.13.0"
      - name: Install native BAM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samtools
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Verify acquisition and POD5 contracts
        run: |
          uv run --locked python -m unittest discover -s tests -p test_acquisition.py -v
          uv run --locked python -m unittest discover -s tests -p test_signals.py -v
      - name: Verify native BAM contracts
        env:
          PYTHONPATH: tests
        run: uv run --locked python -m unittest test_benchmark.NativeBamTests -v
